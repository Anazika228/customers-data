<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة الشركات - شركة سعد خليف العنزي للمحاماة والأستشارات القانونية</title>
    <!-- مكتبات Firebase للربط السحابي والمزامنة اللحظية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary-color: #1b365d;
            --secondary-color: #c5a059;
            --bg-color: #f4f6f9;
            --text-color: #333;
        }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header {
            text-align: center;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .sync-badge {
            display: inline-block;
            background-color: #d4edda;
            color: #155724;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }
        button:hover {
            background-color: #142846;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>شركة سعد خليف العنزي للمحاماة والأستشارات القانونية</h1>
            <div class="subtitle">المملكة العربية السعودية - نظام إدارة ومتابعة الشركات والعملاء</div>
            <div id="syncStatus" class="sync-badge">جاري الاتصال بالسيرفر السحابي المباشر...</div>
        </header>

        <div class="controls">
            <button onclick="addNewCompanySample()">+ إضافة سجل تجريبي جديد (اختبار المزامنة)</button>
        </div>

        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>م</th>
                        <th>اسم الشركة / العميل</th>
                        <th>رقم السجل التجاري</th>
                        <th>نوع الاستشارة / القضية</th>
                        <th>حالة الملف</th>
                        <th>آخر تحديث</th>
                    </tr>
                </thead>
                <tbody id="databaseTableBody">
                    <tr>
                        <td colspan="6">جاري مزامنة وسحب البيانات من السحابي...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // إعدادات الربط السحابي المخصصة لمشروعك في Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD1k0_Y5_2A66bb9Tsjt-Yp7Aq7lx7Wllo",
            authDomain: "customers-data-a622f.firebaseapp.com",
            databaseURL: "https://customers-data-a622f-default-rtdb.firebaseio.com",
            projectId: "customers-data-a622f",
            storageBucket: "customers-data-a622f.firebasestorage.app",
            messagingSenderId: "177869113477",
            appId: "1:177869113477:web:841c9e4fb4a571a186c1ec",
            measurementId: "G-54BMEED80R"
        };

        // تهيئة الاتصال بمنصة Firebase
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('law_firm_companies');

        // مصفوفة بيانات الشركات العامة
        let companies = {};

        // الاستماع الفوري واللحظي لأي تعديل أو إضافة من أي جهاز أو محامي آخر
        dbRef.on('value', (snapshot) => {
            const serverData = snapshot.val();
            document.getElementById('syncStatus').innerText = "متصل بالسحابة - المزامنة اللحظية مفعلة ✓";
            document.getElementById('syncStatus').style.backgroundColor = "#d4edda";
            document.getElementById('syncStatus').style.color = "#155724";
            
            if (serverData) {
                companies = serverData;
            } else {
                companies = {}; // قاعدة البيانات فارغة حالياً
            }
            renderTable();
        }, (error) => {
            document.getElementById('syncStatus').innerText = "خطأ في الاتصال بالسيرفر السحابي!";
            document.getElementById('syncStatus').style.backgroundColor = "#f8d7da";
            document.getElementById('syncStatus').style.color = "#721c24";
        });

        // دالة عرض وتحديث الجدول على الشاشة
        function renderTable() {
            const tbody = document.getElementById('databaseTableBody');
            tbody.innerHTML = '';

            const keys = Object.keys(companies);
            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6">لا توجد بيانات مسجلة حالياً. اضغط على زر الإضافة لتجربة المزامنة.</td></tr>`;
                return;
            }

            keys.forEach((key, index) => {
                const item = companies[key];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.name || '---'}</td>
                    <td>${item.cr || '---'}</td>
                    <td>${item.service || '---'}</td>
                    <td>${item.status || 'نشط'}</td>
                    <td>${item.lastUpdate || '---'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // دالة تجريبية لإضافة شركة جديدة ومزامنتها فوراً عند باقي الزملاء
        function addNewCompanySample() {
            const companyNames = ["شركة النفط والتقنية المتقدمة", "مؤسسة الرياض التجارية", "شركة الرمال الذكية للاستثمار", "شركة البحار الخليجية للمقاولات"];
            const services = ["استشارات عقود هندسية", "حوكمة شركات", "نزاع تجاري دولي", "تسجيل علامات تجارية"];
            
            const randomName = companyNames[Math.floor(Math.random() * companyNames.length)] + " " + Math.floor(Math.random() * 1000);
            const randomCr = "1010" + Math.floor(100000 + Math.random() * 900000);
            const randomService = services[Math.floor(Math.random() * services.length)];
            const timeNow = new Date().toLocaleTimeString('ar-SA');

            const newKey = firebase.database().ref().child('law_firm_companies').push().key;
            
            const newRecord = {
                id: newKey,
                name: randomName,
                cr: randomCr,
                service: randomService,
                status: "قيد المراجعة",
                lastUpdate: timeNow
            };

            // الحفظ المباشر في السحابة (ليراها جميع المحامين في نفس اللحظة عبر الرابط)
            firebase.database().ref('law_firm_companies/' + newKey).set(newRecord);
        }
    </script>
</body>
</html>
